<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><title>Сравнение картинок</title>
<style>
  :root { --status-bar-color: var(--background-color-default, #ffffff);
          --frame: #d8d4cc; --edge: rgba(0,0,0,.12); --like: #6f8f68; --muted: var(--text-color-muted, #666); }
  :root[data-color-mode="dark"], :root[data-theme-tone="dark"] {
          --frame: #3b3631; --edge: rgba(255,255,255,.12); --like: #9fbd97; }
  @media (prefers-color-scheme: dark) {
    :root:not([data-color-mode]):not([data-theme-tone]) {
          --frame: #3b3631; --edge: rgba(255,255,255,.12); --like: #9fbd97; }
  }
  html, body { height: 100%; }
  body { margin: 0; display: flex; flex-direction: column;
         background: var(--background-color-default, #fff); color: var(--text-color-default, #1f2328);
         font-family: var(--font-sans, "Segoe UI", sans-serif); font-size: 14px; line-height: 20px; }
  header { position: sticky; top: 0; z-index: 5; background: var(--background-color-default, #fff);
           padding: 10px 16px 8px; border-bottom: 1px solid var(--frame); }
  .top { display: flex; align-items: center; gap: 14px; }
  h1 { margin: 0; font-size: 18px; line-height: 24px; font-weight: 600; flex: 1 1 auto; min-width: 0; overflow-wrap: anywhere; }
  .top > :not(h1) { flex: none; }
  .seg { display: inline-flex; border: 1px solid var(--edge); border-radius: 6px; overflow: hidden; }
  .seg button { border: 0; border-radius: 0; padding: 4px 7px; line-height: 0; color: var(--muted); }
  .seg button svg { width: 18px; height: 14px; fill: currentColor; }
  .seg button.on { background: var(--edge); color: inherit; }
  button { font: inherit; padding: 4px 12px; border-radius: 6px; cursor: pointer;
           border: 1px solid var(--frame); background: transparent; color: inherit; }
  button:disabled, textarea:disabled, input:disabled { opacity: .55; cursor: default; }
  button.send { font-weight: 600; }
  main { flex: 1; overflow: auto; padding: 8px 16px 32px; }
  section { margin: 14px 0 22px; }
  h2 { margin: 0 0 2px; font-size: 16px; font-weight: 600; }
  .note { color: var(--muted); font-size: 12px; margin-bottom: 6px; }
  /* Поле в одну строку высотой с текст; растёт, только когда в нём пишут
     (field-sizing, а где его нет - autosize() в скрипте). */
  textarea { font: inherit; font-size: 13px; line-height: 18px; width: 100%; box-sizing: border-box; resize: none;
             overflow: hidden; field-sizing: content; min-height: 0; height: auto; padding: 5px 10px;
             border-radius: 6px; border: 1px solid var(--edge); background: transparent; color: inherit; }
  textarea:focus { outline: none; border-color: var(--like); }
  .grid { display: grid; gap: 16px; margin-top: 10px; align-items: start; grid-auto-flow: row dense; }
  .grid.c1 { grid-template-columns: 1fr; }
  .grid.c2 { grid-template-columns: 1fr 1fr; }
  .card { border: 1px solid var(--edge); border-radius: 8px; overflow: hidden; display: flex; flex-direction: column;
          box-shadow: 0 1px 2px rgba(0,0,0,.06), 0 4px 14px rgba(0,0,0,.07); transition: box-shadow .15s, border-color .15s; }
  .card.like { }
  /* Фон под картинкой - инлайн-стилем у самой .pic, а не классом на body:
     хост переписывает классы body своими. Переключатель есть только у
     картинок с прозрачностью. */
  .pic { cursor: pointer; display: flex; align-items: center; justify-content: center; max-height: 78vh; }
  .pic img { max-width: 100%; max-height: 78vh; display: block; }
  .bar { display: flex; gap: 8px; align-items: center; padding: 6px 8px; }
  .card > .bar { border-bottom: 1px solid var(--edge); }
  .bar .name { font-size: 14px; font-weight: 600; margin-right: auto; overflow-wrap: anywhere; line-height: 18px; }
  .bar .name small { color: var(--muted); font-weight: 400; font-size: 12px; margin-left: 6px; }
  .aux { display: inline-flex; align-items: center; gap: 8px; padding-right: 12px; border-right: 1px solid var(--edge); }
  .aux:empty { display: none; }
  .bgsw { width: 16px; height: 16px; padding: 0; border-radius: 4px; border: 1px solid var(--edge);
          opacity: .55; transition: opacity .15s; }
  .bgsw:hover { opacity: 1; }
  .hide { border: 0; padding: 2px; line-height: 0; color: var(--muted); opacity: .55; transition: opacity .15s; }
  .hide:hover:not(:disabled) { opacity: 1; }
  .hide svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; }
  .card.hidden { box-shadow: none; grid-column: 1 / -1; }
  .card.hidden > .bar { border-bottom: 0; padding: 3px 8px; }
  .card.hidden .name { font-weight: 400; }
  .unhide { font-size: 12px; padding: 1px 10px; }
  .pick { border: 0; padding: 2px; line-height: 0; color: var(--muted); }
  .pick svg { width: 26px; height: 26px; transition: transform .12s; }
  .pick .ring { fill: none; stroke: currentColor; stroke-width: 1.4; opacity: .7; }
  .pick .tick { fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; opacity: 0; }
  .pick:hover:not(:disabled) .tick { opacity: .45; }
  .pick.on { color: var(--like); }
  .pick.on .ring { fill: var(--like); stroke: var(--like); opacity: 1; }
  .pick.on .tick { stroke: #fff; opacity: 1; }
  .card textarea { border: 0; border-top: 1px solid var(--edge); border-radius: 0; padding: 7px 10px; }
  .card textarea:focus { background: rgba(127,127,127,.06); }
  #full { position: fixed; inset: 0; z-index: 10; display: none; flex-direction: column; background: #141414; color: #eee; }
  #full.open { display: flex; }
  #full .stage { flex: 1; display: flex; gap: 6px; min-height: 0; }
  .pane { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  .pane .fpic { flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center; cursor: pointer; }
  .pane .fpic img { max-width: 100%; max-height: 100%; }
  .pane .bar { background: rgba(20,20,20,.88); padding: 6px 12px; }
  .pane textarea { flex: 0 1 40%; }
  #full > .bar { background: #0d0d0d; color: #eee; padding: 8px 12px; border-top: 1px solid #333; }
  #full .bar .name { color: #eee; }
  #full .pick:not(.on) { color: #bbb; }
  #full .aux { border-right-color: #444; }
  #full button { color: #eee; border-color: #555; }
  #full .seg { border-color: #444; }
  #full .seg button.on { background: #444; }
  #full textarea { background: rgba(255,255,255,.06); color: #eee; border-color: #555; }
  .fcount { color: #999; font-size: 13px; margin-right: auto; font-variant-numeric: tabular-nums; }
  .full { border: 0; padding: 2px; line-height: 0; color: var(--muted); opacity: .55; transition: opacity .15s; }
  .full:hover { opacity: 1; }
  .full svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
  .idle { color: var(--muted); padding: 20px 16px; }
  .sent { color: var(--like); font-size: 13px; }
  .prog { display: flex; align-items: center; gap: 10px; margin-top: 8px; }
  .prog[hidden] { display: none; }
  .track { flex: 1; height: 10px; border-radius: 5px; background: var(--frame); overflow: hidden; position: relative; }
  .fill { height: 100%; background: var(--like); border-radius: 5px; transition: width .6s ease; }
  .track .run { position: absolute; top: 0; bottom: 0; border-radius: 5px; background: var(--like); opacity: .35;
                animation: breathe 1.6s ease-in-out infinite; transition: left .6s ease, width .6s ease; }
  .ptext { font-size: 13px; font-weight: 600; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .ptext small { color: var(--muted); font-weight: 400; font-size: 12px; margin-left: 6px; }
  .card.pending { border-style: dashed; box-shadow: none; }
  .slot { min-height: 220px; display: flex; align-items: center; justify-content: center;
          color: var(--muted); font-size: 15px; letter-spacing: .03em; }
  .slot.drawing { color: var(--text-color-default, #1f2328);
                  animation: breathe 1.6s ease-in-out infinite; }
  @keyframes breathe { 50% { opacity: .45; } }
</style></head>
<body>
<div id="root" style="display:contents"><div class="idle">Загружаю…</div></div>
<div id="full">
  <div class="stage" id="fstage"></div>
  <div class="bar">
    <button id="fprev" title="назад (←)">←</button>
    <button id="fnext" title="вперёд (→)">→</button>
    <span class="seg" id="fmode"><button data-v="1" title="одна"></button><button data-v="2" title="две рядом"></button></span>
    <span class="fcount" id="fcount"></span>
    <button id="fclose" title="закрыть (Esc)">✕</button>
  </div>
</div>
<script>
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const ID = new URLSearchParams(location.search).get("i") || "default";
const q = (p) => `/look${p}${p.includes("?") ? "&" : "?"}i=${encodeURIComponent(ID)}`;
const api = (p, body) => fetch(q(p), {method: "POST", body: JSON.stringify(body ?? {})}).then((r) => r.json());

let cur = null, flat = [], fullAt = -1;
let cols = localStorage.getItem("look.cols") || (innerWidth >= 1100 ? "2" : "1");
// Прозрачная картинка по умолчанию лежит на шахматке: так сразу видно, где
// у неё прозрачность. Одна кнопка-образец перебирает фон по кругу, выбор
// помнится по пути файла.
const BACKGROUNDS = {
  check: "background-color:#fff; background-image:conic-gradient(#d6d6d6 25%, #fff 0 50%, #d6d6d6 0 75%, #fff 0); background-size:24px 24px;",
  dark: "background:#141414;",
  light: "background:#f4f1ea;",
};
const BG_ORDER = ["check", "dark", "light"];
const BG_NAMES = { check: "шахматка", dark: "тёмный", light: "светлый" };
let bgOf = {};
try { bgOf = JSON.parse(localStorage.getItem("look.bgs") || "{}"); } catch { }
const bgKey = (im) => (im.path || "").toLowerCase();
const bgOfIm = (im) => bgOf[bgKey(im)] || "check";
const bgStyle = (im) => im.alpha ? BACKGROUNDS[bgOfIm(im)] : "";
function bgButton(im){
  if (!im.alpha) return "";
  const b = bgOfIm(im);
  return `<button class="bgsw" title="фон: ${BG_NAMES[b]} (щёлкни, чтобы сменить)" style="${BACKGROUNDS[b]} background-size:8px 8px;"></button>`;
}
function nextBg(im){
  const b = BG_ORDER[(BG_ORDER.indexOf(bgOfIm(im)) + 1) % BG_ORDER.length];
  bgOf[bgKey(im)] = b; localStorage.setItem("look.bgs", JSON.stringify(bgOf));
  const c = document.querySelector(`.card[data-k="${im.gi}.${im.ii}"]`);
  if (c){
    c.querySelector(".pic").style.cssText = bgStyle(im);
    c.querySelector(".bgsw").outerHTML = bgButton(im);
    c.querySelector(".bgsw").onclick = () => nextBg(im);
  }
  if (fullAt >= 0) syncFull();
}
// Отметка «нравится» - кружок с галочкой: пустой контур или заливка
// шалфейным, тем же цветом, что полоса прогресса.
const PICK = `<svg viewBox="0 0 24 24" aria-hidden="true"><circle class="ring" cx="12" cy="12" r="10"/><path class="tick" d="M7.2 12.4l3.2 3.2 6.4-6.8"/></svg>`;
const EYE_OFF = `<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12s3.3-6 9-6c1.6 0 3 .5 4.2 1.1M21 12s-3.3 6-9 6c-1.6 0-3-.5-4.2-1.1"/><path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"/><path d="M4 20L20 4"/></svg>`;
const EXPAND = `<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>`;
const ICON_ONE = `<svg viewBox="0 0 18 14"><rect x="3" y="1" width="12" height="12" rx="1.5"/></svg>`;
const ICON_TWO = `<svg viewBox="0 0 18 14"><rect x="0.5" y="2" width="8" height="10" rx="1.5"/><rect x="9.5" y="2" width="8" height="10" rx="1.5"/></svg>`;
function pick(on, dis){
  return `<button class="rate pick${on ? " on" : ""}" data-r="like" title="${on ? "нравится (снять)" : "нравится"}" aria-pressed="${on}" ${dis}>${PICK}</button>`;
}
// Подпись - label от сессии; без него имя файла без расширения.
function caption(im){
  return esc(im.label || im.name.replace(/\.[^.]+$/, ""));
}

// Опрос раз в 1.5 с. Весь круг перерисовывается, только когда поменялся
// его состав (propose, add); готовность кадров и прогресс патчатся на месте,
// чтобы не сбивать набор комментария. Набранный текст держится в drafts и
// при перерисовке берётся оттуда, а не с сервера.
let structure = "", drafts = {}, progressAt = null, clockSkew = 0;
async function poll(){
  try {
    const s = await api("/state");
    clockSkew = s.now ? s.now - Date.now() : 0;
    const stamp = JSON.stringify([s.rid, s.state, (s.groups || []).map((g) => g.images.map((im) => [im.path, im.label]))]);
    if (stamp !== structure){ structure = stamp; cur = s; render(); return; }
    const was = cur; cur = s;
    flat = visible();
    for (const g of cur.groups) for (const im of g.images){
      const old = was.groups[im.gi]?.images[im.ii];
      if (!old || old.ready !== im.ready || old.v !== im.v) patchCard(im);
    }
    showProgress();
  } catch(e){ }
}

function src(im){ return q(`/img?g=${im.gi}&n=${im.ii}`) + "&v=" + im.v; }

// Первый недорисованный кадр круга - «рисуется», остальные - «в очереди».
function firstPending(){
  for (const g of cur.groups) for (const im of g.images) if (!im.ready) return im;
  return null;
}

function card(im, locked){
  const key = `${im.gi}.${im.ii}`;
  if (!im.ready){
    const now = firstPending() === im;
    return `<div class="card pending" data-k="${key}">` +
      `<div class="bar"><span class="name">${caption(im)}</span></div>` +
      `<div class="slot${now ? " drawing" : ""}">${now ? "рисуется…" : "в очереди"}</div></div>`;
  }
  const dis = locked ? "disabled" : "";
  const text = drafts[im.path] ?? im.comment ?? "";
  // Скрытая картинка сворачивается в полоску: подпись, галочка и «показать».
  // Скрытие и отметка независимы.
  const on = im.rating === "like";
  if (im.hidden)
    return `<div class="card hidden" data-k="${key}">` +
      `<div class="bar"><span class="name">${caption(im)}</span>` +
      `<span class="aux"><button class="unhide" ${dis}>показать</button></span>` +
      pick(on, dis) + `</div></div>`;
  // Подпись, фон, «скрыть» и галочка над картинкой, комментарий под ней.
  return `<div class="card${on ? " like" : ""}" data-k="${key}">` +
    `<div class="bar"><span class="name">${caption(im)}</span>` +
    `<span class="aux">${bgButton(im)}<button class="full" title="на весь экран">${EXPAND}</button><button class="hide" title="скрыть, чтобы не занимала место" ${dis}>${EYE_OFF}</button></span>` +
    pick(on, dis) + `</div>` +
    `<div class="pic" style="${bgStyle(im)}"><img loading="lazy" src="${src(im)}" alt="${esc(im.label || im.name)}"></div>` +
    `<textarea class="cmt" rows="1" placeholder="комментарий" ${dis}>${esc(text)}</textarea></div>`;
}

function patchCard(im){
  const el = document.querySelector(`.card[data-k="${im.gi}.${im.ii}"]`);
  if (!el) return;
  el.outerHTML = card(im, cur.state !== "ждёт");
  // Заглушка «рисуется» переезжает на следующий кадр.
  const next = firstPending();
  if (next && next !== im) document.querySelectorAll(".card.pending .slot").forEach((s) => {
    const k = s.closest(".card").dataset.k, mine = k === `${next.gi}.${next.ii}`;
    s.classList.toggle("drawing", mine); s.textContent = mine ? "рисуется…" : "в очереди";
  });
  wireCards();
}


const mmss = (s) => `${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}`;
// Полоса прогресса под шапкой: сплошная часть - готовые кадры, бледная
// пульсирующая - кадр, который рисуется сейчас. Видна, пока круг не
// дорисован или пока сессия держит progress.
function showProgress(){
  const el = document.getElementById("progress");
  if (!el || !cur) return;
  const p = cur.progress;
  const done = p ? p.done : cur.ready, total = p ? p.total : cur.total;
  if ((!p && done >= total) || !total){ el.hidden = true; return; }
  const share = Math.min(1, done / total);
  el.querySelector(".fill").style.width = `${share * 100}%`;
  const run = el.querySelector(".run");
  run.style.left = `${share * 100}%`; run.style.width = done < total ? `${100 / total}%` : "0";
  let text = done >= total ? `готово, ${total} из ${total}` : `готово ${done} из ${total}`;
  let small = "";
  if (p && p.until && done < total){
    const left = Math.round((p.until - (Date.now() + clockSkew)) / 1000);
    small = left > 0 ? `осталось ~${mmss(left)}` : "вот-вот";
  }
  if (p && p.note) small += (small ? " · " : "") + p.note;
  el.querySelector(".ptext").innerHTML = esc(text) + (small ? `<small>${esc(small)}</small>` : "");
  el.hidden = false;
}
setInterval(showProgress, 1000);

function render(){
  const root = document.getElementById("root");
  if (!cur || !cur.rid){ root.innerHTML = `<div class="idle">Круга пока нет: сессия покажет здесь варианты картинок.</div>`; return; }
  const locked = cur.state !== "ждёт";
  flat = visible();
  const focus = document.activeElement?.matches?.("textarea") ? document.activeElement : null;
  const fkey = focus && (focus.closest(".card")?.dataset.k ?? "g" + focus.closest("section")?.dataset.g);
  const caret = focus?.selectionStart;
  // Заголовок один: имя круга в шапке. Имена групп выводятся, только когда
  // групп больше одной.
  const many = cur.groups.length > 1;
  root.innerHTML = `<header><div class="top"><h1>${esc(cur.title)}</h1>` +
    `<span class="seg" id="cols"><button data-v="1" title="по одной" class="${cols === "1" ? "on" : ""}">${ICON_ONE}</button>` +
    `<button data-v="2" title="по две" class="${cols === "2" ? "on" : ""}">${ICON_TWO}</button></span>` +
    (locked ? `<span class="sent">передано</span>` : `<button class="send" id="send" title="передать отметки и комментарии в сессию">Готово</button>`) +
    `</div><div class="prog" id="progress" hidden><div class="track"><div class="fill"></div><div class="run"></div></div><span class="ptext"></span></div>` +
    `</header><main>` +
    cur.groups.map((g, gi) => `<section data-g="${gi}">` + (many ? `<h2>${esc(g.name)}</h2>` : "") +
      (g.note ? `<div class="note">${esc(g.note)}</div>` : "") +
      `<textarea class="gcmt" rows="1" placeholder="комментарий серии" ${locked ? "disabled" : ""}>${esc(drafts["g:" + g.name] ?? g.comment)}</textarea>` +
      `<div class="grid c${cols}">${g.images.map((im) => card(im, locked)).join("")}</div></section>`).join("") +
    `</main>`;
  showProgress();
  wire(locked);
  if (fkey){
    const el = fkey.startsWith("g") ? document.querySelector(`section[data-g="${fkey.slice(1)}"] .gcmt`)
                                    : document.querySelector(`.card[data-k="${fkey}"] .cmt`);
    if (el){ el.focus(); if (caret != null) el.setSelectionRange(caret, caret); }
  }
}

const timers = {};
function later(key, fn){ clearTimeout(timers[key]); timers[key] = setTimeout(fn, 300); }
function imOf(k){ const [g, n] = k.split(".").map(Number); return cur.groups[g].images[n]; }

function rate(im, r){
  im.rating = im.rating === r ? null : r;
  api("/mark", {rid: cur.rid, g: im.gi, n: im.ii, rating: im.rating});
  const c = document.querySelector(`.card[data-k="${im.gi}.${im.ii}"]`);
  if (c){
    c.classList.toggle("like", im.rating === "like");
    c.querySelectorAll(".rate").forEach((b) => {
      const on = b.dataset.r === im.rating;
      b.classList.toggle("on", on); b.setAttribute("aria-pressed", on); });
  }
  if (fullAt >= 0) syncFull();
}
// Свернуть или развернуть: карточка собирается заново.
function setHidden(im, hidden){
  im.hidden = hidden;
  api("/mark", {rid: cur.rid, g: im.gi, n: im.ii, hidden});
  const c = document.querySelector(`.card[data-k="${im.gi}.${im.ii}"]`);
  if (c){ c.outerHTML = card(im, cur.state !== "ждёт"); wireCards(); }
}
// На полном экране листаются все готовые картинки, и скрытые тоже.
const visible = () => cur.groups.flatMap((g) => g.images).filter((im) => im.ready);

function comment(im, text){
  im.comment = text; drafts[im.path] = text;
  later(`${im.gi}.${im.ii}`, () => api("/mark", {rid: cur.rid, g: im.gi, n: im.ii, comment: text}));
}

// Обработчики карточек отдельно: patchCard заменяет одну карточку и
// навешивает их заново, не трогая остальную страницу.
function wireCards(){
  const locked = cur.state !== "ждёт";
  // Щелчок по картинке ставит или снимает «нравится»; полный экран - кнопкой.
  document.querySelectorAll(".card .full").forEach((b) => b.onclick = () =>
    openFull(flat.indexOf(imOf(b.closest(".card").dataset.k))));
  document.querySelectorAll(".card .bgsw").forEach((b) => b.onclick = () => nextBg(imOf(b.closest(".card").dataset.k)));
  if (locked) return;
  document.querySelectorAll(".pic").forEach((p) => p.onclick = () => rate(imOf(p.closest(".card").dataset.k), "like"));
  document.querySelectorAll(".card .rate").forEach((b) => b.onclick = () => rate(imOf(b.closest(".card").dataset.k), b.dataset.r));
  document.querySelectorAll(".card .hide").forEach((b) => b.onclick = () => setHidden(imOf(b.closest(".card").dataset.k), true));
  document.querySelectorAll(".card .unhide").forEach((b) => b.onclick = () => setHidden(imOf(b.closest(".card").dataset.k), false));
  document.querySelectorAll(".card .cmt").forEach((t) => t.oninput = () => comment(imOf(t.closest(".card").dataset.k), t.value));
}

function wire(locked){
  document.querySelectorAll("#cols button").forEach((b) => b.onclick = () => {
    cols = b.dataset.v; localStorage.setItem("look.cols", cols); render(); });
  wireCards();
  if (locked) return;
  document.querySelectorAll(".gcmt").forEach((t) => t.oninput = () => {
    const gi = +t.closest("section").dataset.g;
    cur.groups[gi].comment = t.value; drafts["g:" + cur.groups[gi].name] = t.value;
    later("g" + gi, () => api("/mark", {rid: cur.rid, g: gi, comment: t.value}));
  });
  document.getElementById("send").onclick = async (e) => {
    const left = flat.filter((im) => im.rating !== "like").length;
    if (left === flat.length && !confirm("Ни одна картинка не отмечена «нравится». Всё равно отправить?")) return;
    e.target.disabled = true; e.target.textContent = "Передаю…";
    await new Promise((r) => setTimeout(r, 400));
    await api("/submit", {rid: cur.rid});
    structure = ""; poll();
  };
}

// Полный экран: одна картинка или две рядом. Стрелки сдвигают на одну,
// так что в режиме «две» можно вести сравнение цепочкой: 1-2, 2-3, ...
// Щелчок по картинке ставит или снимает «нравится», у каждой своя подпись,
// фон и комментарий.
const full = document.getElementById("full"), fstage = document.getElementById("fstage");
let fullMode = localStorage.getItem("look.fullmode") || "1";
const fullItems = () => {
  const n = fullMode === "2" && flat.length > 1 ? 2 : 1;
  return Array.from({length: n}, (_, j) => flat[(fullAt + j) % flat.length]);
};
function paneHtml(im){
  const locked = cur.state !== "ждёт", dis = locked ? "disabled" : "";
  const g = cur.groups[im.gi], on = im.rating === "like";
  return `<div class="pane" data-k="${im.gi}.${im.ii}">` +
    `<div class="fpic" style="${bgStyle(im)}"><img src="${src(im)}" alt="${esc(im.label || im.name)}"></div>` +
    `<div class="bar"><span class="name">${cur.groups.length > 1 ? esc(g.name) + " · " : ""}${caption(im)}</span>` +
    `<span class="aux">${bgButton(im)}</span>${pick(on, dis)}` +
    `<textarea class="fcmt" rows="1" placeholder="комментарий" ${dis}>${esc(drafts[im.path] ?? im.comment ?? "")}</textarea></div></div>`;
}
function showFull(i){
  if (!flat.length){ closeFull(); return; }
  fullAt = (i + flat.length) % flat.length;
  const items = fullItems();
  fstage.innerHTML = items.map(paneHtml).join("");
  document.getElementById("fcount").textContent =
    items.length > 1 ? `${fullAt + 1}–${(fullAt + 1) % flat.length + 1} из ${flat.length}` : `${fullAt + 1} из ${flat.length}`;
  document.querySelectorAll("#fmode button").forEach((b) => b.classList.toggle("on", b.dataset.v === fullMode));
  const locked = cur.state !== "ждёт";
  fstage.querySelectorAll(".pane").forEach((p) => {
    const im = () => imOf(p.dataset.k);
    p.querySelector(".bgsw")?.addEventListener("click", () => nextBg(im()));
    if (locked) return;
    p.querySelector(".fpic").onclick = () => rate(im(), "like");
    p.querySelector(".pick").onclick = () => rate(im(), "like");
    p.querySelector(".fcmt").oninput = (e) => comment(im(), e.target.value);
  });
}
// Отметка и фон меняются на месте, чтобы не сбить набор комментария.
function syncFull(){
  fstage.querySelectorAll(".pane").forEach((p) => {
    const im = imOf(p.dataset.k), on = im.rating === "like";
    const b = p.querySelector(".pick");
    b.classList.toggle("on", on); b.setAttribute("aria-pressed", on);
    p.querySelector(".fpic").style.cssText = bgStyle(im);
    const aux = p.querySelector(".aux");
    aux.innerHTML = bgButton(im);
    aux.querySelector(".bgsw")?.addEventListener("click", () => nextBg(imOf(p.dataset.k)));
  });
}
function openFull(i){ if (i < 0) return; full.classList.add("open"); showFull(i); }
function closeFull(){ full.classList.remove("open"); fullAt = -1; render(); }
document.querySelectorAll("#fmode button").forEach((b) => {
  b.innerHTML = b.dataset.v === "2" ? ICON_TWO : ICON_ONE;
  b.onclick = () => { fullMode = b.dataset.v; localStorage.setItem("look.fullmode", fullMode); showFull(fullAt); };
});
document.getElementById("fprev").onclick = () => showFull(fullAt - 1);
document.getElementById("fnext").onclick = () => showFull(fullAt + 1);
document.getElementById("fclose").onclick = closeFull;
document.addEventListener("keydown", (e) => {
  if (fullAt < 0) return;
  if (e.key === "Escape"){ closeFull(); return; }
  if (document.activeElement?.matches?.("textarea")) return;
  if (e.key === "ArrowLeft") showFull(fullAt - 1);
  if (e.key === "ArrowRight") showFull(fullAt + 1);
});

setInterval(poll, 1500); poll();

// Где нет field-sizing, поле подгоняется по высоте скриптом.
if (!CSS.supports("field-sizing", "content")){
  const autosize = (t) => { t.style.height = "auto"; t.style.height = t.scrollHeight + 2 + "px"; };
  document.addEventListener("input", (e) => { if (e.target.matches("textarea")) autosize(e.target); });
  new MutationObserver(() => document.querySelectorAll("textarea").forEach(autosize)).observe(document.body, {childList: true, subtree: true});
}
</script>
</body></html>
